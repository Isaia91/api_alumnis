<!-- src/app/features/alumni/alumni-detail/alumni-detail.html -->
<div class="container py-4">
  <a routerLink="/alumni" class="btn btn-link">← Retour</a>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  <div class="text-center py-4" *ngIf="loading">
    <div class="spinner-border" role="status"></div>
  </div>

  <ng-container *ngIf="!loading && data as a">
    <section class="alumni-detail-section">
      <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
          <div class="flipcard">
            <div class="flipcard-inner">

              <!-- FACE -->
              <div class="cover" [ngClass]="itemClass(a)">
                <!-- Badge avatar (initiales) -->
                <div class="avatar-badge" aria-hidden="true">{{ initials(a) }}</div>

                <!-- Nom -->
                <h1 class="title">{{ displayName(a) }}</h1>

                <!-- Formation • Promotion -->
                <div class="meta">
                  {{ a.formation || 'Formation —' }}
                  <span class="dot">•</span>
                  {{ a.promotion || '—' }}
                </div>

                <!-- Actions rapides (face) -->
              </div>
              <!-- /FACE -->

              <!-- DOS (désormais frère de .cover) -->
              <div class="card-back">
                <div class="back-inner">
                  <dl class="data">
                    <div>
                      <dt>Nom</dt>
                      <dd>{{ a.nom || '—' }}</dd>
                    </div>
                    <div>
                      <dt>Prénom</dt>
                      <dd>{{ a.prenom || '—' }}</dd>
                    </div>
                  </dl>

                  <div class="back-actions">
                    <a *ngIf="a.linkedin" class="btn-solid" [href]="a.linkedin" target="_blank" rel="noopener">Voir le profil LinkedIn</a>
                    <a *ngIf="a.email" class="btn-outline" [href]="'mailto:'+a.email">Contacter</a>
                  </div>

                  <div class="story" *ngIf="a.temoignage_parcours || a.profil">
                    <h6>Parcours / témoignage</h6>
                    <p [innerText]="a.temoignage_parcours || a.profil"></p>
                  </div>
                </div>
              </div>
              <!-- /DOS -->

            </div> <!-- /.flipcard-inner -->
          </div> <!-- /.flipcard -->
        </div>
      </div>
    </section>
  </ng-container>
</div>
